<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かんたん家計簿</title>
<style>
  /* ===== 画面全体の色（タブで切り替わる） =====
     ふだんは敵２変動費の「ピンク」。敵１固定費タブを開くと下の .kind-fixed が上書きして「青」になる。
     同じ明るさ・鮮やかさのまま色あいだけをずらしているので、やさしい雰囲気はそのまま。 */
  :root {
    --bg: #fff7f5;            /* 背景 */
    --g1: #ffb3c6;            /* ヘッダー等のグラデ（明） */
    --g2: #ff8fab;            /* ヘッダー等のグラデ（濃） */
    --gShadow35: rgba(255,143,171,.35);
    --gShadow50: rgba(255,143,171,.5);
    --tabBg: #fdeaee;         /* 選ばれていないタブ */
    --tabFg: #c99aa8;
    --track: #f4e3e3;         /* バーの下地 */
    --tint: #fff0f3;          /* 「1日いくらまで」等の帯 */
    --tintFg: #d16d88;
    --accent: #c98a9c;        /* 小見出し・リンク */
    --muted: #a08c8c;         /* 補足文字 */
    --muted2: #b8a5a5;        /* さらに薄い文字 */
    --ink: #4a3f3f;           /* 本文の文字 */
    --cardShadow10: rgba(180,140,140,.10);
    --cardShadow08: rgba(180,140,140,.08);
    --line: #f0d9dd;          /* 入力欄のふち */
    --inputBg: #fffafb;       /* 入力欄の中 */
    --inputBg2: #fff8fa;
    --faint: #e0d2d2;         /* ✕ボタン等 */
    --chev: #d9bcbc;          /* ＞印 */
    --rowLine: #f6e9e9;       /* 一覧の区切り線 */
  }
  body.kind-fixed {
    --bg: #f5faff;
    --g1: #b3d6ff;
    --g2: #8fc3ff;
    --gShadow35: rgba(143,195,255,.35);
    --gShadow50: rgba(143,195,255,.5);
    --tabBg: #eaf3fd;
    --tabFg: #9aafc9;
    --track: #e3ebf4;
    --tint: #f0f7ff;
    --tintFg: #6d97d1;
    --accent: #8aa5c9;
    --muted: #8c94a0;
    --muted2: #a5adb8;
    --ink: #3f434a;
    --cardShadow10: rgba(140,160,180,.12);
    --cardShadow08: rgba(140,160,180,.10);
    --line: #d9e3f0;
    --inputBg: #fafcff;
    --inputBg2: #f8fbff;
    --faint: #d2d8e0;
    --chev: #bccbd9;
    --rowLine: #e9eef6;
  }
  /* 敵３不定期の固定費 → みどり */
  body.kind-fixed_yearly {
    --bg: #f5fdf9;
    --g1: #a8e6cf;
    --g2: #7fd3b2;
    --gShadow35: rgba(127,211,178,.35);
    --gShadow50: rgba(127,211,178,.5);
    --tabBg: #e8f7f0;
    --tabFg: #8fb8a8;
    --track: #e3f4ee;
    --tint: #eefaf5;
    --tintFg: #3f9e7c;
    --accent: #7ab8a0;
    --muted: #8ca099;
    --muted2: #a5b8b1;
    --ink: #3f4a46;
    --cardShadow10: rgba(140,180,165,.12);
    --cardShadow08: rgba(140,180,165,.10);
    --line: #d9f0e8;
    --inputBg: #fafffd;
    --inputBg2: #f8fffc;
    --faint: #d2e0db;
    --chev: #bcd9ce;
    --rowLine: #e9f6f1;
  }
  /* 敵４不定期の変動費 → むらさき */
  body.kind-var_yearly {
    --bg: #faf7ff;
    --g1: #d5c2ff;
    --g2: #b79bff;
    --gShadow35: rgba(183,155,255,.35);
    --gShadow50: rgba(183,155,255,.5);
    --tabBg: #f0eafd;
    --tabFg: #ab9ac9;
    --track: #ece3f4;
    --tint: #f5f0ff;
    --tintFg: #8a63c9;
    --accent: #a08ac9;
    --muted: #978ca0;
    --muted2: #afa5b8;
    --ink: #453f4a;
    --cardShadow10: rgba(161,140,180,.12);
    --cardShadow08: rgba(161,140,180,.10);
    --line: #e5d9f0;
    --inputBg: #fdfaff;
    --inputBg2: #fcf8ff;
    --faint: #d9d2e0;
    --chev: #cbbcd9;
    --rowLine: #f0e9f6;
  }
  /* 色が切り替わるときにふわっと変える */
  body, header, #tabs, .tab, #detail, .dHead, .card, .item { transition: background-color .25s, color .25s; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; background: var(--bg); color: var(--ink); padding-bottom: 100px; }
  header { position: sticky; top: 0; z-index: 10; background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: center; gap: 18px; box-shadow: 0 2px 8px var(--gShadow35); }
  header h1 { font-size: 18px; min-width: 8.5em; text-align: center; font-weight: 700; }
  header button { background: rgba(255,255,255,.25); border: none; color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 14px; cursor: pointer; }
  #gear { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; }
  /* 今すぐメールを取り込むボタン（ヘッダー左）。
     絵文字だと輪郭が四角くて回転が不自然なので、左右対称の丸いアイコンを描いています */
  #mailBtn { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: none; align-items: center; justify-content: center; padding: 0; }
  body.mail-ready #mailBtn { display: flex; }
  #mailBtn svg { display: block; }
  #mailBtn.spinning svg { animation: spin .9s linear infinite; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ふわっと出るお知らせ */
  #toast { position: fixed; left: 50%; top: 72px; transform: translateX(-50%); z-index: 60; background: rgba(70,58,58,.9); color: #fff; font-size: 13px; font-weight: 700; padding: 9px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .3s; max-width: 86%; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  #toast.show { opacity: 1; }
  /* とても細い画面（iPhone SE 第1世代など）では ▶ と ⚙️ が重ならないよう少し詰める */
  @media (max-width: 340px) { header { gap: 8px; } header h1 { min-width: 7.5em; font-size: 16px; } }
  /* タブ（敵１固定費／敵２変動費） */
  /* 4つのタブを横1列。中は2行（上＝敵の番号・大きめ／下＝名前・控えめ） */
  #tabs { position: sticky; top: 62px; z-index: 9; display: flex; gap: 5px; max-width: 560px; margin: 0 auto; padding: 8px 12px 4px; background: var(--bg); }
  .tab { flex: 1 1 0; min-width: 0; border: none; border-radius: 999px; padding: 6px 3px; font-family: inherit; cursor: pointer; background: var(--tabBg); color: var(--tabFg); transition: background .2s, color .2s; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
  .tab b { font-size: 14px; font-weight: 700; }
  /* 下段は「敵３不定期の固定費」が入りきる大きさに。画面が細いスマホでは自動で少し縮む */
  .tab span { font-size: min(9.5px, 2.7vw); font-weight: 700; opacity: .8; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .tab.on { background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; box-shadow: 0 2px 7px var(--gShadow35); }
  main { max-width: 560px; margin: 0 auto; padding: 14px; }
  .card { background: #fff; border-radius: 20px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 3px 10px var(--cardShadow10); }
  .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .big { font-size: 34px; font-weight: 700; }
  .big.ok { color: #4caf8e; } .big.warn { color: #e8963e; } .big.over { color: #e05d5d; }
  .bar { height: 12px; background: var(--track); border-radius: 6px; overflow: hidden; margin: 10px 0 8px; }
  .bar > div { height: 100%; border-radius: 6px; background: #7fc8a9; transition: width .4s; }
  .bar.warn > div { background: #f5b971; } .bar.over > div { background: #ef8080; }
  .sub { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .perday { margin-top: 10px; font-size: 13px; background: var(--tint); border-radius: 12px; padding: 8px 12px; color: var(--tintFg); }
  h2 { font-size: 14px; color: var(--accent); margin: 4px 2px 8px; }
  .cat { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .cat .name { width: 9.2em; font-size: 12px; flex-shrink: 0; white-space: nowrap; }
  .cat .cbar { flex: 1; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .cat .cbar > div { height: 100%; border-radius: 4px; transition: width .4s; }
  .cat .num { font-size: 11px; color: var(--muted); width: 7.8em; text-align: right; flex-shrink: 0; }
  .day { font-size: 12px; color: var(--accent); font-weight: 700; margin: 14px 4px 5px; }
  /* 円グラフ（今月の内訳） */
  .donutWrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .donutSvg { width: 130px; height: 130px; flex-shrink: 0; }
  .donutCenter { fill: var(--ink); font-weight: 700; }
  .donutCenterSub { fill: var(--muted); }
  .legend { flex: 1; min-width: 140px; }
  .legrow { display: flex; align-items: center; gap: 7px; padding: 3px 0; font-size: 12px; }
  .legdot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .legname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legpct { color: var(--muted); width: 3.2em; text-align: right; flex-shrink: 0; }
  .legamt { width: 5.2em; text-align: right; flex-shrink: 0; }
  .item { background: #fff; border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 6px var(--cardShadow08); }
  .item .info { flex: 1; min-width: 0; }
  .item .shop { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { font-size: 11px; color: var(--muted2); }
  .item select { border: 1px solid var(--line); background: var(--inputBg2); border-radius: 8px; font-size: 11px; padding: 3px 2px; color: var(--accent); max-width: 7.5em; }
  .item .amt { font-size: 15px; font-weight: 700; white-space: nowrap; }
  .item .del { border: none; background: none; color: var(--faint); font-size: 14px; cursor: pointer; padding: 4px 2px; }
  .editcue { font-size: 11px; opacity: 0.4; filter: grayscale(0.7); margin: 0 2px; flex-shrink: 0; }
  .carddot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; margin-right: 4px; vertical-align: middle; opacity: 0.85; }
  #fab { position: fixed; right: 20px; bottom: 24px; width: 58px; height: 58px; border-radius: 50%; border: none; background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; font-size: 30px; line-height: 1; box-shadow: 0 4px 14px var(--gShadow50); cursor: pointer; z-index: 20; }
  .overlay { position: fixed; inset: 0; background: rgba(80,60,60,.35); display: none; z-index: 30; }
  .overlay.show { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 24px 24px 0 0; padding: 20px 20px 34px; z-index: 31; max-width: 560px; margin: 0 auto; display: none; max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  /* シート（オーバーレイ）を開いている間は背景をスクロールさせない */
  body:has(.overlay.show) { overflow: hidden; }
  .sheet h3 { font-size: 15px; color: var(--accent); margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; min-width: 0; max-width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 16px; background: var(--inputBg); color: var(--ink); font-family: inherit; }
  .field textarea { resize: vertical; line-height: 1.5; }
  /* iOS Safari の日付入力が枠からはみ出すのを防ぐ */
  .field input[type="date"] { -webkit-appearance: none; appearance: none; }
  .field input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; min-width: 0; }
  .row2 { display: flex; gap: 10px; } .row2 .field { flex: 1 1 0; min-width: 0; }
  .primaryBtn { width: 100%; border: none; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--g1), var(--g2)); margin-top: 4px; cursor: pointer; }
  .primaryBtn:disabled { opacity: .5; }
  .linkBtn { display: block; width: 100%; background: none; border: none; color: var(--accent); font-size: 13px; margin-top: 16px; cursor: pointer; text-decoration: underline; }
  .setlist { margin-bottom: 14px; }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; }
  .setrow .setname { font-size: 14px; }
  .setrow input { width: 8em; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 16px; text-align: right; background: var(--inputBg); color: var(--ink); }
  .settotal { font-size: 12px; color: var(--muted); text-align: right; margin: 2px 2px 12px; }
  .setnote { font-size: 12px; color: var(--accent); background: var(--tint); border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; line-height: 1.5; }
  .empty { text-align: center; color: var(--muted2); font-size: 13px; padding: 20px 0; }

  /* カテゴリ詳細画面 */
  .cat { cursor: pointer; }
  .cat .name { display: flex; align-items: center; }
  .cat .chev { color: var(--chev); font-size: 12px; margin-left: 4px; }
  #detail { position: fixed; inset: 0; background: var(--bg); z-index: 40; display: none; flex-direction: column; }
  #detail.show { display: flex; }
  .dHead { background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px var(--gShadow35); flex-shrink: 0; }
  .dHead button { background: rgba(255,255,255,.25); border: none; color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 15px; cursor: pointer; flex-shrink: 0; }
  .dHead .dTtl { font-size: 16px; font-weight: 700; }
  .dHead .dSub { font-size: 12px; opacity: .9; margin-top: 2px; }
  .dBody { flex: 1; overflow-y: auto; padding: 14px; max-width: 560px; margin: 0 auto; width: 100%; overscroll-behavior: contain; }
  .chartSvg { width: 100%; height: auto; display: block; }
  .dEmpty { text-align: center; color: var(--muted2); font-size: 13px; padding: 24px 0; }
  /* 編集シートは詳細画面(z40)より上に出す */
  #editOverlay { z-index: 45; }
  #editSheet { z-index: 46; }
  /* 費目の編集シートは費目一覧シートより上に出す */
  #catEditOverlay { z-index: 47; }
  #catEditSheet { z-index: 48; }
  /* テンプレの編集シートは、テンプレ一覧より前面に出す */
  #tplEditOverlay { z-index: 47; }
  #tplEditSheet { z-index: 48; }
  .catrow { display: flex; align-items: center; gap: 10px; padding: 10px 2px; cursor: pointer; border-bottom: 1px solid var(--rowLine); }
  .catrow .cemoji { font-size: 20px; width: 1.5em; text-align: center; }
  .catrow .cname { flex: 1; font-size: 14px; }
  .catrow .cdot { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
  .catrow .csub { font-size: 11px; color: var(--muted2); margin-top: 2px; }
  .catrow.coff { opacity: .45; }

  /* 毎月テンプレのお知らせバー（タブのすぐ下に出る） */
  #tplBar { display: none; max-width: 560px; margin: 4px auto 0; padding: 0 14px; }
  #tplBar .tplBox { background: var(--tint); border-radius: 16px; padding: 12px 14px; }
  #tplBar .tplBox + .tplBox { margin-top: 8px; }
  #tplBar .tplMsg { font-size: 13px; color: var(--tintFg); line-height: 1.55; }
  /* メール取り込みのエラー用。どのタブでも同じ色（気づいてほしいので） */
  #tplBar .tplBox.warn { background: #ffecec; border: 1.5px solid #f0bcbc; }
  #tplBar .tplBox.warn .tplMsg { color: #b3565b; word-break: break-word; }
  #tplBar .tplBox.warn .tplBtns button.ghost { color: #b3565b; border-color: #f0c4c4; }
  #tplBar .tplBtns { display: flex; gap: 8px; margin-top: 10px; }
  #tplBar .tplBtns button { flex: 1; border: none; border-radius: 12px; padding: 10px; font-family: inherit; font-size: 14px; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--g1), var(--g2)); cursor: pointer; }
  #tplBar .tplBtns button.ghost { background: none; color: var(--accent); border: 1.5px solid var(--line); }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; padding: 2px 0; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
  .swatch.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }

  /* 年間まとめ画面（敵１〜敵４を横断して見るので、専用の色にしています） */
  #year {
    --bg: #fffbf5; --g1: #ffd9a0; --g2: #f5b866;
    --gShadow35: rgba(245,184,102,.35); --gShadow50: rgba(245,184,102,.5);
    --track: #f4eee3; --tint: #fffaf0; --tintFg: #b8873a; --accent: #c2a678;
    --muted: #a0998c; --muted2: #b8b1a5; --ink: #4a463f;
    --cardShadow10: rgba(180,165,140,.12); --cardShadow08: rgba(180,165,140,.10);
    --line: #f0e8d9; --inputBg: #fffdfa; --inputBg2: #fffcf8;
    --faint: #e0dbd2; --chev: #d9cebc; --rowLine: #f6f1e9;
    position: fixed; inset: 0; z-index: 41; display: none; flex-direction: column;
    background: var(--bg); color: var(--ink);
  }
  #year.show { display: flex; }
  #year .dHead .ynav { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
  .plus { color: #4caf8e; } .minus { color: #e05d5d; }
  .sumrow { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; color: var(--muted); }
  .sumrow b { font-size: 15px; color: var(--ink); }

  /* ログイン画面 */
  #login { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(160deg, #ffe3ea, #fff7f5); z-index: 50; }
  .logincard { background: #fff; border-radius: 24px; padding: 30px 24px; width: 100%; max-width: 360px; box-shadow: 0 8px 24px rgba(255,143,171,.25); }
  .loginttl { font-size: 20px; font-weight: 700; color: #ff7aa2; text-align: center; margin-bottom: 22px; }
  .loginmsg { font-size: 12px; margin-top: 12px; text-align: center; min-height: 1.2em; color: #e05d5d; }

  /* ログイン状態による表示切替 */
  body:not(.signed-in) header, body:not(.signed-in) main, body:not(.signed-in) #fab, body:not(.signed-in) #tabs, body:not(.signed-in) #tplBar { display: none !important; }
  body:not(.signed-in) #login { display: flex; }
</style>
</head>
<body>
<header>
  <button id="mailBtn" onclick="fetchMailNow()" title="今すぐメールを取り込む" aria-label="今すぐメールを取り込む">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"></polyline>
      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </svg>
  </button>
  <button onclick="moveMonth(-1)">◀</button>
  <h1 id="ymLabel">…</h1>
  <button onclick="moveMonth(1)">▶</button>
  <button id="gear" onclick="openSettings()">⚙️</button>
</header>
<div id="toast"></div>
<nav id="tabs">
  <button class="tab" data-kind="fixed" onclick="switchKind('fixed')"><b>敵１</b><span>固定費</span></button>
  <button class="tab on" data-kind="variable" onclick="switchKind('variable')"><b>敵２</b><span>変動費</span></button>
  <button class="tab" data-kind="fixed_yearly" onclick="switchKind('fixed_yearly')"><b>敵３</b><span>不定期の固定費</span></button>
  <button class="tab" data-kind="var_yearly" onclick="switchKind('var_yearly')"><b>敵４</b><span>不定期の変動費</span></button>
</nav>
<div id="tplBar"></div>
<main id="app"></main>
<button id="fab" onclick="openSheet()">＋</button>

<!-- カテゴリ詳細画面 -->
<div id="detail">
  <div class="dHead">
    <button onclick="closeCatDetail()">◀</button>

    { name: '家具・家電', emoji: '🛋️', budget: 0, color: '#c9b6a0' },

    { name: 'プレゼント', emoji: '🎁', budget: 0, color: '#e0b0d0' }
  ];
  // 収入の「内容」の選択肢（📊年間まとめ画面で使います）
  // 増やしたいときはこの表に足してください。ここに無いものは「その他」で自由に書けます
  var INCOME_NAMES = ['真治給料', '麻衣子給料', 'チエ子生活費', '賞与', '児童手当'];
  /* ▲▲▲ 設定はここまで ▲▲▲ */

  /* ============================================================

     view: 'month'＝1ヶ月ずつ見るタブ／'year'＝1年ずつ見るタブ
     ============================================================ */
  var KINDS = [
    { key: 'fixed',        label: '敵１固定費',         view: 'month', defs: DEFAULT_FIXED,        color: '#8fc3ff' },
    { key: 'variable',     label: '敵２変動費',         view: 'month', defs: DEFAULT_CATEGORIES,   color: '#ff8fab' },
    { key: 'fixed_yearly', label: '敵３不定期の固定費',  view: 'year',  defs: DEFAULT_FIXED_YEARLY, color: '#7fd3b2' },
    { key: 'var_yearly',   label: '敵４不定期の変動費',  view: 'year',  defs: DEFAULT_VAR_YEARLY,   color: '#b79bff' }
  ];
  function kindDef(k) {
    for (var i = 0; i < KINDS.length; i++) if (KINDS[i].key === k) return KINDS[i];
    return KINDS[1];  // 見つからないときは敵２変動費あつかい
  }
  function kindLabel(k) { return kindDef(k).label; }
  // いま見ているタブが「年で見るタブ」（敵３・敵４）かどうか
  function isYearView() { return kindDef(kind).view === 'year'; }

  // 実際に使う費目リスト。Supabaseの categories テーブルがあればそれで上書きされる
  function cloneDefaults(kindName) {
    var src = kindDef(kindName).defs;
    return src.map(function (c, i) {
      return { name: c.name, emoji: c.emoji, color: c.color, budget: c.budget, sort: i, kind: kindName || 'variable' };
    });
  }
  function allDefaults() {
    var arr = [];
    KINDS.forEach(function (k) {
      cloneDefaults(k.key).forEach(function (c) { c.sort = arr.length; arr.push(c); });
    });
    return arr;
  }
  // ALL_CATEGORIES＝全タブぶん／CATEGORIES＝いま見ているタブのぶん
  var ALL_CATEGORIES = allDefaults();
  var CATEGORIES = [];
  function applyKind() {
    CATEGORIES = ALL_CATEGORIES.filter(function (c) { return (c.kind || 'variable') === kind; });
    // タブごとに画面全体の色を変える（変動費=ピンク／固定費=青／敵３=みどり／敵４=むらさき）
    KINDS.forEach(function (k) {
      document.body.classList.toggle('kind-' + k.key, kind === k.key);
    });
  }
  // 色えらびのパレット（かわいいパステル系）
  var PALETTE = ['#ff8fab', '#ffc4a3', '#ffd670', '#c3a6ff', '#8fd3c8', '#f5a3c7', '#a3c9ff', '#b5e0a0', '#ff6b6b', '#f7a072', '#9ad0e0', '#e0b0d0', '#b0c0a0', '#c9b6a0'];

  /* ============================================================
     ▼▼▼ カード → 色マルの設定 ▼▼▼
     支払・カード名に「キーワード」が含まれていたら、その色の小さなマルを表示
     （他のカードを足したいときはこの表に行を追加）
     ============================================================ */
  var CARD_COLORS = [
    ['Amazonマスター', '#a5744e'],  // Amazonマスターカード → 茶色のマル
    ['Amazon Master', '#a5744e'],   // 〃（英語表記のとき）
    ['Olive',   '#4a90d9'],         // Oliveゴールド → 青いマル
    ['三井住友', '#4caf8e']          // 三井住友カード → 緑のマル
  ];
  function cardColor(pay) {
    var p = String(pay || '').normalize('NFKC').toUpperCase();
    for (var i = 0; i < CARD_COLORS.length; i++) {
      if (p.indexOf(String(CARD_COLORS[i][0]).normalize('NFKC').toUpperCase()) !== -1) return CARD_COLORS[i][1];
    }
    return '';
  }
  function cardDot(pay) {
    var c = cardColor(pay);
    return c ? '<span class="carddot" style="background:' + c + '"></span>' : '';
  }

  var now = new Date();
  var y = now.getFullYear(), mo = now.getMonth();
  var kind = 'variable';   // いま見ているタブ（'variable'＝敵２変動費／'fixed'＝敵１固定費）
  var data = null;
  // ネットから取ってきたデータを一時的に持っておく箱
  var state = { uid: null, entries: [], budgets: {}, mbudgets: {}, templates: [], tplKeys: {}, runs: [] };
  var lastFetchAt = 0;   // 最後にデータを取ってきた時刻（開き直したときの自動更新用）

  function ymStr() { return y + '-' + ('0' + (mo + 1)).slice(-2); }
  /* 「いま見ている期間」まわり。月タブは1ヶ月ぶん、年タブは1年ぶんを見る。
     予算は年タブでも monthly_budgets に「その年の1月」として保存する。
     こうすると「設定した年から先に反映」が月タブとまったく同じしくみで動く。 */
  function periodKey() { return isYearView() ? (y + '-01') : ymStr(); }
  function periodPrefix() { return isYearView() ? String(y) : ymStr(); }   // 明細をふるい分ける文字列
  function inPeriod(e) { return String(e.date).slice(0, periodPrefix().length) === periodPrefix(); }
  function periodTitle() { return isYearView() ? (y + '年') : (y + '年' + (mo + 1) + '月'); }
  function periodWord() { return isYearView() ? '今年' : '今月'; }
  function yen(n) { return '¥' + Number(n).toLocaleString(); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function jstr(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

  function catDef(name) {
    for (var i = 0; i < ALL_CATEGORIES.length; i++) if (ALL_CATEGORIES[i].name === name) return ALL_CATEGORIES[i];
    return null;
  }
  function kindOf(e) { return e && e.kind ? e.kind : 'variable'; }
  function emojiFor(name) { var c = catDef(name); return c ? c.emoji : ''; }
  var EXTRA_COLORS = ['#c9b6a0', '#9ad0e0', '#e0b0d0', '#b0c0a0'];
  function colorFor(name, i) {
    var c = catDef(name);
    if (c) return c.color;
    return EXTRA_COLORS[(i || 0) % EXTRA_COLORS.length];
  }
  function label(name) { var e = emojiFor(name); return (e ? e + ' ' : '') + name; }
  function budgetFor(name, ym) {
    ym = ym || periodKey();
    // 月ごとの設定があれば「その月以前で一番新しい設定」を使う（＝設定した月から先に反映）
    var arr = state.mbudgets && state.mbudgets[name];
    if (arr && arr.length) {
      var chosen = null;
      for (var i = 0; i < arr.length; i++) { if (arr[i].month <= ym) chosen = arr[i].amount; else break; }
      if (chosen !== null) return chosen;
    }
    // 月ごとの設定より前（過去）は、これまでの共通予算をそのまま使う
    if (name in state.budgets) return Number(state.budgets[name]);
    var c = catDef(name);
    return c ? c.budget : 0;
  }

  /* ---- Supabase からデータを取ってくる ---- */
  async function fetchAll() {
    var res = await Promise.all([
      sb.from('entries').select('*'),
      sb.from('budgets').select('*'),
      sb.from('monthly_budgets').select('*'),
      sb.from('categories').select('*'),
      sb.from('templates').select('*'),
      sb.from('job_runs').select('*').order('ran_at', { ascending: false }).limit(5)
    ]);
    if (res[0].error) throw res[0].error;
    if (res[1].error) throw res[1].error;
    // 削除済み（deleted）の明細は表示しない。※列が未追加でも動くように client 側で除外
    state.entries = (res[0].data || []).filter(function (e) { return !e.deleted; });
    // テンプレから入れた印。※削除した明細もふくめて集めるので、消した月がまた出てくることはない
    state.tplKeys = {};
    (res[0].data || []).forEach(function (e) { if (e.tpl_key) state.tplKeys[e.tpl_key] = true; });
    state.budgets = {};
    (res[1].data || []).forEach(function (r) { state.budgets[r.category] = r.amount; });
    // 月ごとの予算（monthly_budgets テーブルが未作成でもアプリは動くように、エラーは無視）
    state.mbudgets = {};
    if (!res[2].error) {
      (res[2].data || []).forEach(function (r) {
        (state.mbudgets[r.category] = state.mbudgets[r.category] || []).push({ month: r.month, amount: Number(r.amount) });
      });
      Object.keys(state.mbudgets).forEach(function (k) {
        state.mbudgets[k].sort(function (a, b) { return a.month < b.month ? -1 : 1; });
      });
    }
    // 費目（categories テーブル）。未作成ならデフォルトのまま動く
    if (!res[3].error) {
      var rows = res[3].data || [];
      if (rows.length) {
        rows.sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
        ALL_CATEGORIES = rows.map(function (r) {
          return { name: r.name, emoji: r.emoji || '', color: r.color || '#ff8fab', budget: Number(r.budget) || 0, sort: r.sort || 0, kind: r.kind || 'variable' };
        });
        // まだ費目が1つも無いタブがあれば、そのタブの初期費目を入れておく
        // （敵３・敵４を後から足したときも、次に開いたときに自動でそろう）
        for (var ki = 0; ki < KINDS.length; ki++) {
          var kk = KINDS[ki].key;
          if (ALL_CATEGORIES.some(function (c) { return c.kind === kk; })) continue;
          var maxS = ALL_CATEGORIES.reduce(function (m, c) { return Math.max(m, c.sort || 0); }, 0);
          var seed = cloneDefaults(kk).map(function (c, i) { c.sort = maxS + 1 + i; return c; });
          var ins = await sb.from('categories').insert(seed.map(function (c) {
            return { user_id: state.uid, name: c.name, emoji: c.emoji, color: c.color, budget: c.budget, sort: c.sort, kind: kk };
          }));
          if (!ins.error) ALL_CATEGORIES = ALL_CATEGORIES.concat(seed);
        }
      } else {
        // テーブルはあるが空 → 4タブぶんのデフォルト費目を一度だけ登録する
        ALL_CATEGORIES = allDefaults();
        try {
          await sb.from('categories').insert(ALL_CATEGORIES.map(function (c) {
            return { user_id: state.uid, name: c.name, emoji: c.emoji, color: c.color, budget: c.budget, sort: c.sort, kind: c.kind };
          }));
        } catch (e) { /* 失敗してもデフォルトのまま動く */ }
      }
    } else {
      ALL_CATEGORIES = allDefaults();
    }
    // 毎月のテンプレ（templates テーブルが未作成でもアプリは動くように、エラーは無視）
    state.templates = (res[4] && !res[4].error) ? (res[4].data || []) : [];
    state.templates.sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
    // メール取り込みの実行記録（新しい順。job_runs が未作成でも動きます）
    state.runs = (res[5] && !res[5].error) ? (res[5].data || []) : [];
    applyKind();
    lastFetchAt = Date.now();
  }
  async function refresh() {
    document.getElementById('app').innerHTML = '<div class="empty">読み込み中…♪</div>';
    try { await fetchAll(); load(); }
    catch (e) { document.getElementById('app').innerHTML = '<div class="empty">読み込みエラー：' + esc(e.message || e) + '</div>'; }
  }

  /* ---- その月の集計データを組み立てる（手元の state から）---- */
  function buildData() {
    var ym = periodKey();
    var items = state.entries.filter(function (e) {
      return inPeriod(e) && kindOf(e) === kind;
    });
    items.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return String(b.created_at || '').localeCompare(String(a.created_at || ''));
    });
    var spentBy = {}, totalSpent = 0;
    items.forEach(function (it) {
      spentBy[it.category] = (spentBy[it.category] || 0) + Number(it.amount);
      totalSpent += Number(it.amount);
    });
    var budgets = CATEGORIES.map(function (c) {
      return { category: c.name, budget: budgetFor(c.name, ym), spent: spentBy[c.name] || 0 };
    });
    Object.keys(spentBy).forEach(function (name) {
      if (!catDef(name)) budgets.push({ category: name, budget: 0, spent: spentBy[name] });
    });
    return {
      totalBudget: CATEGORIES.reduce(function (s, c) { return s + budgetFor(c.name, ym); }, 0),
      totalSpent: totalSpent,
      budgets: budgets,
      categories: CATEGORIES.map(function (c) { return c.name; }),
      items: items
    };
  }

  // ◀▶ ボタン。月タブなら1ヶ月ずつ、年タブ（敵３・敵４）なら1年ずつ動かす
  function moveMonth(d) {
    if (isYearView()) {
      y += d;
    } else {
      mo += d;
      if (mo < 0) { mo = 11; y--; }
      if (mo > 11) { mo = 0; y++; }
    }
    load();
  }

  function switchKind(k) {
    if (kind === k) return;
    var wasYear = isYearView();
    kind = k;
    // 「月で見るタブ」⇄「年で見るタブ」をまたいだときは今の年月に戻す
    // （敵３で2024年を見たあと敵２に行くと2024年7月が出る、を防ぐ）
    if (wasYear !== isYearView()) { var t = new Date(); y = t.getFullYear(); mo = t.getMonth(); }
    applyKind();
    closeCatDetail();
    document.querySelectorAll('#tabs .tab').forEach(function (b) {
      b.className = 'tab' + (b.getAttribute('data-kind') === k ? ' on' : '');
    });
    load();
  }

  function load() {
    applyKind();
    document.getElementById('ymLabel').textContent = periodTitle();
    render(buildData());
    renderTplBar();
  }

  function render(d) {
    data = d;
    var remain = d.totalBudget - d.totalSpent;
    var ratio = d.totalBudget > 0 ? d.totalSpent / d.totalBudget : 0;
    var mood = ratio >= 1 ? 'over' : ratio >= 0.8 ? 'warn' : 'ok';

    var html;
    if (d.totalBudget === 0) {
      // 予算をまだ設定していないタブは、赤字あつかいにせず「つかった合計」を見せる
      html = '<div class="card"><div class="label">' + periodWord() + 'つかったお金</div>';
      html += '<div class="big">' + yen(d.totalSpent) + '</div>';
      html += '<div class="perday">⚙️ から予算を設定すると「あと使えるお金」が出ます</div>';
      html += '</div>';
    } else {
      html = '<div class="card"><div class="label">' + periodWord() + 'あと使えるお金</div>';
      html += '<div class="big ' + mood + '">' + (remain < 0 ? '−' + yen(-remain) : yen(remain)) + '</div>';
      html += '<div class="bar ' + mood + '"><div style="width:' + Math.min(ratio * 100, 100) + '%"></div></div>';
      html += '<div class="sub"><span>使った額 ' + yen(d.totalSpent) + '</span><span>予算 ' + yen(d.totalBudget) + '</span></div>';

      var today = new Date();
      if (isYearView()) {
        // 年で見るタブは「1ヶ月あたりいくらまで」を出す
        if (today.getFullYear() === y && remain > 0) {
          var monthsLeft = 12 - today.getMonth();
          html += '<div class="perday">🌷 あと' + monthsLeft + 'ヶ月、1ヶ月 ' + yen(Math.floor(remain / monthsLeft)) + ' まで使えます</div>';
        }
      } else if (today.getFullYear() === y && today.getMonth() === mo && remain > 0) {
        var daysLeft = new Date(y, mo + 1, 0).getDate() - today.getDate() + 1;
        html += '<div class="perday">🌷 あと' + daysLeft + '日、1日 ' + yen(Math.floor(remain / daysLeft)) + ' まで使えます</div>';
      }
      if (remain < 0) html += '<div class="perday">😢 予算を ' + yen(-remain) + ' オーバーしています</div>';
      html += '</div>';
    }

    html += donutHtml(d);

    var cats = d.budgets.filter(function (b) { return b.budget > 0 || b.spent > 0; });
    if (cats.length) {
      html += '<div class="card"><h2>カテゴリ別</h2>';
      cats.forEach(function (b) {
        var r = b.budget > 0 ? b.spent / b.budget : (b.spent > 0 ? 1 : 0);
        var col = r >= 1 ? '#ef8080' : r >= 0.8 ? '#f5b971' : '#7fc8a9';
        html += '<div class="cat" onclick="openCatDetail(\'' + jstr(b.category) + '\')">'
          + '<div class="name">' + esc(label(b.category)) + '</div>'
          + '<div class="cbar"><div style="width:' + Math.min(r * 100, 100) + '%;background:' + col + '"></div></div>'
          + '<div class="num">' + yen(b.spent) + (b.budget > 0 ? ' / ' + yen(b.budget) : '') + '</div>'
          + '<div class="chev">❯</div></div>';
      });
      html += '</div>';
    }

    html += '<h2 style="margin-left:6px">明細（' + d.items.length + '件）</h2>';
    if (!d.items.length) html += '<div class="empty">まだ記録がありません。右下の＋から追加してね</div>';
    // 月タブは「日づけ」ごと、年タブ（敵３・敵４）は「月」ごとにまとめて表示する
    var groupOf = function (it) { return isYearView() ? String(it.date).slice(0, 7) : it.date; };
    var groupSum = {};
    d.items.forEach(function (it) { groupSum[groupOf(it)] = (groupSum[groupOf(it)] || 0) + Number(it.amount); });
    var lastG = '';
    d.items.forEach(function (it) {
      var g = groupOf(it);
      if (g !== lastG) {
        lastG = g;
        html += '<div class="day">' + (isYearView()
          ? Number(g.slice(5, 7)) + '月'
          : dayLabel(it.date)) + '（' + yen(groupSum[g]) + '）</div>';
      }
      html += itemHtml(it);
    });

    document.getElementById('app').innerHTML = html;
    fillCatOptions();
  }

  function itemHtml(it) {
    var em = emojiFor(it.category);
    var memo = it.memo ? '<div class="meta">' + esc(it.memo) + '</div>' : '';
    return '<div class="item" style="cursor:pointer" onclick="openEdit(\'' + jstr(it.id) + '\')">'
      + '<div class="info"><div class="shop">' + (em ? em + ' ' : '') + esc(it.shop) + '</div>' + memo + '</div>'
      + '<div class="amt">' + cardDot(it.pay) + yen(it.amount) + '</div>'
      + '<span class="editcue">✏️</span>'
      + '<button class="del" onclick="event.stopPropagation();del(\'' + jstr(it.id) + '\')">✕</button></div>';
  }

  function donutHtml(d) {
    // 使った額が 1円以上の費目だけを、多い順に並べる
    var segs = d.budgets.filter(function (b) { return b.spent > 0; })
      .sort(function (a, b) { return b.spent - a.spent; });
    if (!segs.length) return '';

    var r = 52, cx = 65, cy = 65, C = 2 * Math.PI * r;
    var acc = 0, circles = '', legend = '';
    segs.forEach(function (b, i) {
      var frac = b.spent / d.totalSpent;
      var col = colorFor(b.category, i);
      var len = frac * C;
      // -90度回転して真上（12時）から時計回りに描く
      circles += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" '
        + 'stroke="' + col + '" stroke-width="20" '
        + 'stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" '
        + 'stroke-dashoffset="' + (-acc).toFixed(2) + '" '
        + 'transform="rotate(-90 ' + cx + ' ' + cy + ')"></circle>';
      var pct = Math.round(frac * 100);
      var icon = emojiFor(b.category) || esc(b.category);
      legend += '<div class="legrow" style="cursor:pointer" onclick="openCatDetail(\'' + jstr(b.category) + '\')"><span class="legdot" style="background:' + col + '"></span>'
        + '<span class="legname" style="font-size:16px">' + icon + '</span>'
        + '<span class="legpct">' + pct + '%</span>'
        + '<span class="legamt">' + yen(b.spent) + '</span></div>';
      acc += len;
    });

    var svg = '<svg class="donutSvg" viewBox="0 0 130 130">' + circles
      + '<text class="donutCenterSub" x="65" y="60" text-anchor="middle" font-size="9">合計</text>'
      + '<text class="donutCenter" x="65" y="76" text-anchor="middle" font-size="15">' + yen(d.totalSpent) + '</text>'
      + '</svg>';

    return '<div class="card"><h2>' + periodWord() + 'の内訳</h2><div class="donutWrap">'
      + svg + '<div class="legend">' + legend + '</div></div></div>';
  }

  /* ---- カテゴリ詳細画面（月推移グラフ＋明細）---- */
  var detailCat = null;
  // グラフに出す直近n期間。月タブなら直近nヶ月、年タブ（敵３・敵４）なら直近n年
  function periodsBack(n) {
    var arr = [];
    for (var i = n - 1; i >= 0; i--) {
      if (isYearView()) {
        var yy2 = y - i;
        arr.push({ key: String(yy2), label: yy2 + '年' });
      } else {
        var mm = mo - i, yy = y;
        while (mm < 0) { mm += 12; yy--; }
        arr.push({ key: yy + '-' + ('0' + (mm + 1)).slice(-2), label: (mm + 1) + '月' });
      }
    }
    return arr;
  }
  // その費目を、指定した期間（'2026-07' や '2026'）でいくら使ったか
  function catSpentIn(cat, prefix) {
    var s = 0;
    state.entries.forEach(function (e) {
      if (e.category === cat && String(e.date).slice(0, prefix.length) === prefix && kindOf(e) === kind) s += Number(e.amount);
    });
    return s;
  }
  function barChartSvg(cat) {
    var months = periodsBack(6);
    var vals = months.map(function (m) { return catSpentIn(cat, m.key); });
    var maxV = Math.max.apply(null, vals.concat([1]));
    var col = colorFor(cat);
    var W = 340, H = 190, padT = 24, padB = 24, padX = 6;
    var plotH = H - padT - padB, n = months.length;
    var slot = (W - padX * 2) / n, bw = slot * 0.5;
    var s = '<svg class="chartSvg" viewBox="0 0 ' + W + ' ' + H + '">';
    s += '<line x1="' + padX + '" y1="' + (padT + plotH) + '" x2="' + (W - padX) + '" y2="' + (padT + plotH) + '" style="stroke:var(--line)" stroke-width="1"/>';
    months.forEach(function (m, i) {
      var h = maxV > 0 ? (vals[i] / maxV) * plotH : 0;
      var x = padX + slot * i + (slot - bw) / 2;
      var yb = padT + (plotH - h);
      var cur = (m.key === periodPrefix());
      s += '<rect x="' + x.toFixed(1) + '" y="' + yb.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1)
        + '" rx="4" fill="' + col + '" opacity="' + (cur ? 1 : 0.5) + '"/>';
      if (vals[i] > 0) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (yb - 5).toFixed(1) + '" text-anchor="middle" font-size="10" style="fill:var(--muted)">' + Number(vals[i]).toLocaleString() + '</text>';
      s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle" font-size="11" style="fill:' + (cur ? 'var(--accent)' : 'var(--muted2)') + '"' + (cur ? ' font-weight="700"' : '') + '>' + m.label + '</text>';
    });
    s += '</svg>';
    return s;
  }
  function openCatDetail(cat) {
    detailCat = cat;
    var total = catSpentIn(cat, periodPrefix());
    document.getElementById('dTtl').textContent = label(cat);
    document.getElementById('dSub').textContent = (isYearView() ? y + '年' : (mo + 1) + '月') + '　' + yen(total);

    var html = '<div class="card">' + barChartSvg(cat) + '</div>';

    var items = state.entries.filter(function (e) {
      return e.category === cat && inPeriod(e) && kindOf(e) === kind;
    });
    items.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return String(b.created_at || '').localeCompare(String(a.created_at || ''));
    });

    html += '<h2 style="margin-left:6px">明細（' + items.length + '件）</h2>';
    if (!items.length) {
      html += '<div class="dEmpty">この' + (isYearView() ? '年' : '月') + 'の記録はありません</div>';
    } else {
      // 月タブは日づけごと、年タブは月ごとに小計を出す
      var gOf = function (it) { return isYearView() ? String(it.date).slice(0, 7) : it.date; };
      var lastG = '', gTotal = {};
      items.forEach(function (it) { gTotal[gOf(it)] = (gTotal[gOf(it)] || 0) + Number(it.amount); });
      items.forEach(function (it) {
        var g = gOf(it);
        if (g !== lastG) {
          lastG = g;
          html += '<div class="day">' + (isYearView() ? Number(g.slice(5, 7)) + '月' : dayLabel(it.date))
            + '（' + yen(gTotal[g]) + '）</div>';
        }
        html += itemRowEditable(it);
      });
    }
    document.getElementById('dBody').innerHTML = html;
    document.getElementById('dBody').scrollTop = 0;
    document.getElementById('detail').classList.add('show');
  }
  function closeCatDetail() {
    detailCat = null;
    document.getElementById('detail').classList.remove('show');
  }

  /* ---- 明細の編集シート（詳細画面からタップで開く）---- */
  function itemRowEditable(it) {
    var memo = it.memo ? '<div class="meta">' + esc(it.memo) + '</div>' : '';
    return '<div class="item" style="cursor:pointer" onclick="openEdit(\'' + jstr(it.id) + '\')">'
      + '<div class="info"><div class="shop">' + esc(it.shop) + '</div>' + memo + '</div>'
      + '<div class="amt">' + cardDot(it.pay) + yen(it.amount) + '</div>'
      + '<span class="editcue">✏️</span></div>';
  }
  // 指定タブの費目リストを <option> にする
  function catOptionsFor(kindName, selected) {
    var cats = ALL_CATEGORIES.filter(function (c) { return (c.kind || 'variable') === kindName; })
      .map(function (c) { return c.name; });
    if (selected && cats.indexOf(selected) === -1) cats.push(selected);
    return cats.map(function (c) {
      return '<option value="' + esc(c) + '"' + (c === selected ? ' selected' : '') + '>' + esc(label(c)) + '</option>';
    }).join('');
  }
  // タブを切り替えたら費目の選択肢も入れ替える
  function onEditKindChange() {
    var k = document.getElementById('e_kind').value;
    document.getElementById('e_cat').innerHTML = catOptionsFor(k, null);
  }
  function openEdit(id) {
    var it = state.entries.filter(function (e) { return e.id === id; })[0];
    if (!it) return;
    var itKind = kindOf(it);
    var catOpts = catOptionsFor(itKind, it.category);
    var kindOpts = KINDS.map(function (p) {
      return '<option value="' + p.key + '"' + (p.key === itKind ? ' selected' : '') + '>' + p.label + '</option>';
    }).join('');
    var pays = ['現金', 'カード', '電子マネー', 'その他'];
    if (pays.indexOf(it.pay) === -1) pays.unshift(it.pay);
    var payOpts = pays.map(function (p) {
      return '<option' + (p === it.pay ? ' selected' : '') + '>' + esc(p) + '</option>';
    }).join('');
    var h = '<h3>✏️ 記録を編集</h3>'
      + '<div class="row2">'
      + '<div class="field"><label>金額（円）</label><input type="number" id="e_amount" inputmode="numeric" value="' + esc(it.amount) + '"></div>'
      + '<div class="field"><label>日付</label><input type="date" id="e_date" value="' + esc(String(it.date).slice(0, 10)) + '"></div>'
      + '</div>'
      + '<div class="field"><label>内容・お店</label><input type="text" id="e_shop" value="' + esc(it.shop) + '"></div>'
      + '<div class="field"><label>メモ（買ったもの・誰と など／任意）</label><input type="text" id="e_memo" value="' + esc(it.memo || '') + '" placeholder="○○とランチ など"></div>'
      + '<div class="row2">'
      + '<div class="field"><label>タブ</label><select id="e_kind" onchange="onEditKindChange()">' + kindOpts + '</select></div>'
      + '<div class="field"><label>カテゴリ</label><select id="e_cat">' + catOpts + '</select></div>'
      + '</div>'
      + '<div class="field"><label>支払・カード</label><select id="e_pay">' + payOpts + '</select></div>'
      + '<button class="primaryBtn" id="editSaveBtn" onclick="saveEdit(\'' + jstr(id) + '\')">保存する</button>'
      + '<button class="linkBtn" onclick="delFromEdit(\'' + jstr(id) + '\')">✕ この記録を削除</button>';
    document.getElementById('editSheet').innerHTML = h;
    document.getElementById('editOverlay').className = 'overlay show';
    document.getElementById('editSheet').style.display = 'block';
  }
  function closeEdit() {
    document.getElementById('editOverlay').className = 'overlay';
    document.getElementById('editSheet').style.display = 'none';
  }
  async function saveEdit(id) {
    var amount = Number(document.getElementById('e_amount').value);
    if (!(amount > 0)) { alert('金額を入れてください'); return; }
    var btn = document.getElementById('editSaveBtn');
    btn.disabled = true; btn.textContent = '保存中…';
    var res = await sb.from('entries').update({
      date: document.getElementById('e_date').value,
      amount: Math.round(amount),
      shop: document.getElementById('e_shop').value || '（無題）',
      category: document.getElementById('e_cat').value,
      memo: document.getElementById('e_memo').value || '',
      pay: document.getElementById('e_pay').value,
      kind: document.getElementById('e_kind').value
    }).eq('id', id);
    btn.disabled = false; btn.textContent = '保存する';
    if (res.error) { alert('保存に失敗：' + res.error.message); return; }
    closeEdit();
    await refresh();
    reopenDetailIfOpen();
  }
  async function delFromEdit(id) {
    closeEdit();
    await del(id);
  }

  function catSelect(it) {
    var opts = data.categories.slice();
    if (opts.indexOf(it.category) === -1) opts.push(it.category);
    var h = '<select onchange="changeCat(\'' + it.id + '\', this.value)">';
    opts.forEach(function (c) {
      h += '<option value="' + esc(c) + '"' + (c === it.category ? ' selected' : '') + '>' + esc(label(c)) + '</option>';
    });
    return h + '</select>';
  }

  function dayLabel(dateStr) {
    var p = String(dateStr).split('-');
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    var w = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
    return Number(p[1]) + '月' + Number(p[2]) + '日（' + w + '）';
  }

  async function changeCat(id, cat) {
    var res = await sb.from('entries').update({ category: cat }).eq('id', id);
    if (res.error) { alert('変更に失敗：' + res.error.message); return; }
    await refresh();
    reopenDetailIfOpen();
  }

  async function del(id) {
    if (!confirm('この記録を削除しますか？')) return;
    // 本当に消さず「削除済み」の印をつける（＝メールから再取り込みされるのを防ぐ）
    var res = await sb.from('entries').update({ deleted: true }).eq('id', id);
    if (res.error) {
      var m = String(res.error.message || '');
      if (/deleted/.test(m) || /column|schema cache/.test(m)) {
        alert('削除の準備（entries に deleted 列を追加）がまだのようです。手順を確認してください🙏');
      } else { alert('削除に失敗：' + m); }
      return;
    }
    await refresh();
    reopenDetailIfOpen();
  }
  function reopenDetailIfOpen() {
    if (detailCat && document.getElementById('detail').classList.contains('show')) openCatDetail(detailCat);
  }

  /* ---- 追加シート ---- */
  function openSheet() {
    var t = new Date();
    var td = t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
    // 今の月（年）を見ているなら今日。過去や先の月（年）を見ているならその1日を初期値にする
    document.getElementById('f_date').value =
      (td.slice(0, periodPrefix().length) === periodPrefix()) ? td : (isYearView() ? y + '-01-01' : ymStr() + '-01');
    document.getElementById('f_amount').value = '';
    document.getElementById('f_shop').value = '';
    document.getElementById('f_memo').value = '';
    fillCatOptions();
    document.getElementById('overlay').className = 'overlay show';
    document.getElementById('sheet').style.display = 'block';
  }
  function closeSheet() {
    document.getElementById('overlay').className = 'overlay';
    document.getElementById('sheet').style.display = 'none';
  }
  function fillCatOptions() {
    var sel = document.getElementById('f_cat');
    if (!data) return;
    var prev = sel.value;   // 選び直しにならないよう、選択中の費目は覚えておく
    sel.innerHTML = '';
    data.categories.forEach(function (c) {
      var o = document.createElement('option');
      o.value = c;
      o.textContent = label(c);
      sel.appendChild(o);
    });
    if (prev && data.categories.indexOf(prev) !== -1) sel.value = prev;
  }
  async function save() {
    var amount = Number(document.getElementById('f_amount').value);
    if (!amount || amount <= 0) { alert('金額を入れてください'); return; }
    var btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = '保存中…';
    var res = await sb.from('entries').insert({
      user_id: state.uid,
      date: document.getElementById('f_date').value,
      amount: Math.round(amount),
      shop: document.getElementById('f_shop').value || '（無題）',
      category: document.getElementById('f_cat').value,
      memo: document.getElementById('f_memo').value || '',
      pay: '',
      kind: kind
    });
    btn.disabled = false; btn.textContent = '追加する';
    if (res.error) { alert('保存に失敗：' + res.error.message); return; }
    closeSheet();
    await refresh();
  }

  /* ---- 予算の設定シート ---- */
  function openSettings() {
    var yv = isYearView();
    var h = '<h3>⚙️ 予算の設定（1' + (yv ? '年' : 'ヶ月') + 'あたり）</h3>';
    h += '<div class="setnote">📅 <b>' + periodTitle() + 'から先</b>に反映されます（過去の' + (yv ? '年' : '月') + 'は変わりません）</div>';
    h += '<div class="setlist">';
    CATEGORIES.forEach(function (c) {
      var val = budgetFor(c.name, periodKey());
      h += '<div class="setrow"><span class="setname">' + esc(label(c.name)) + '</span>'
        + '<input type="number" inputmode="numeric" data-cat="' + esc(c.name) + '" value="' + val + '"></div>';
    });
    h += '</div><div class="settotal" id="setTotal"></div>';
    h += '<button class="primaryBtn" id="setSaveBtn" onclick="saveSettings()">保存する</button>';
    h += '<button class="linkBtn" onclick="openYear()">📊 年間まとめ（収入と支出）</button>';
    h += '<button class="linkBtn" onclick="openCatManager()">🏷 費目を編集（追加・名前・色）</button>';
    h += '<button class="linkBtn" onclick="openTplManager()">🔁 毎月のテンプレ（きまった出費・収入）</button>';
    h += '<button class="linkBtn" onclick="openImport()">📥 データをまとめて取り込み</button>';
    h += '<div class="setnote" style="margin:16px 0 0">📬 <b>メール取り込みのようす</b><br>' + lastRunText() + '</div>';
    h += '<button class="linkBtn" onclick="doLogout()">ログアウト</button>';
    var el = document.getElementById('setSheet');
    el.innerHTML = h;
    updateSetTotal();
    el.querySelectorAll('input[data-cat]').forEach(function (inp) { inp.addEventListener('input', updateSetTotal); });
    document.getElementById('setOverlay').className = 'overlay show';
    el.style.display = 'block';
  }
  function updateSetTotal() {
    var sum = 0;
    document.querySelectorAll('#setSheet input[data-cat]').forEach(function (inp) { sum += Number(inp.value) || 0; });
    document.getElementById('setTotal').textContent = '合計予算：' + yen(sum) + (isYearView() ? ' / 年' : ' / 月');
  }
  async function saveSettings() {
    // 年タブは「その年の1月」として保存する（＝設定した年から先に反映）
    var ym = periodKey();
    var rows = [];
    document.querySelectorAll('#setSheet input[data-cat]').forEach(function (inp) {
      rows.push({ user_id: state.uid, category: inp.getAttribute('data-cat'), month: ym, amount: Number(inp.value) || 0 });
    });
    var btn = document.getElementById('setSaveBtn');
    btn.disabled = true; btn.textContent = '保存中…';
    var res = await sb.from('monthly_budgets').upsert(rows, { onConflict: 'user_id,category,month' });
    btn.disabled = false; btn.textContent = '保存する';
    if (res.error) {
      var m = String(res.error.message || '');
      if (/monthly_budgets/.test(m) || /relation|does not exist|schema cache/.test(m)) {

  async function saveCat() {
    var name = document.getElementById('c_name').value.trim();
    var emoji = document.getElementById('c_emoji').value.trim();
    var color = catEditColor;
    if (!name) { alert('費目の名前を入れてください'); return; }
    // 「収入」は年間まとめ画面が使っている特別な名前なので、費目には使えない
    if (name === '収入') { alert('「収入」は年間まとめで使っている名前のため、費目には使えません🙏'); return; }
    // 予算は費目名で管理しているため、名前は全タブを通してかぶらないようにする
    if (ALL_CATEGORIES.some(function (c) { return c.name === name && c.name !== catEditOrig; })) {
      alert('同じ名前の費目がすでにあります（敵１〜敵４のどれかで使われています）'); return;
    }
    var btn = document.getElementById('catSaveBtn');
    btn.disabled = true; btn.textContent = '保存中…';
    try {
      if (!catEditOrig) {
        var maxSort = ALL_CATEGORIES.reduce(function (m, c) { return Math.max(m, c.sort || 0); }, 0);
        throwIf(await sb.from('categories').upsert([{ user_id: state.uid, name: name, emoji: emoji, color: color, budget: 0, sort: maxSort + 1, kind: kind }], { onConflict: 'user_id,name' }));
      } else if (name === catEditOrig) {
        throwIf(await sb.from('categories').update({ emoji: emoji, color: color }).eq('name', catEditOrig));
      } else {
        // 名前変更：既存の明細・予算もまとめて新しい名前に付け替える
        throwIf(await sb.from('entries').update({ category: name }).eq('category', catEditOrig));
        throwIf(await sb.from('budgets').update({ category: name }).eq('category', catEditOrig));
        throwIf(await sb.from('monthly_budgets').update({ category: name }).eq('category', catEditOrig));
        var old = catDef(catEditOrig) || { budget: 0, sort: 0, kind: kind };
        throwIf(await sb.from('categories').upsert([{ user_id: state.uid, name: name, emoji: emoji, color: color, budget: old.budget || 0, sort: old.sort || 0, kind: old.kind || kind }], { onConflict: 'user_id,name' }));
        throwIf(await sb.from('categories').delete().eq('name', catEditOrig));
      }
    } catch (e) {
      btn.disabled = false; btn.textContent = '保存する';
      var m = String(e.message || e);
      if (/categories/.test(m) || /does not exist|schema cache|relation/.test(m)) {
        alert('費目テーブル（categories）がまだ作られていないようです。準備の手順を確認してください🙏');
      } else { alert('保存に失敗：' + m); }
      return;
    }
    btn.disabled = false; btn.textContent = '保存する';
    closeCatEdit();
    await refresh();
    openCatManager();
  }
  async function deleteCat() {
    var name = catEditOrig;
    var used = state.entries.filter(function (e) { return e.category === name; }).length;
    var msg = '「' + name + '」を削除しますか？';
    if (used) msg += '\n（この費目の明細が' + used + '件あります。明細は残りますが、色やアイコンは外れます）';
    if (!confirm(msg)) return;
    var res = await sb.from('categories').delete().eq('name', name);
    if (res.error) { alert('削除に失敗：' + res.error.message); return; }
    closeCatEdit();
    await refresh();
    openCatManager();
  }
  function throwIf(res) { if (res && res.error) throw res.error; return res; }

  /* ============================================================
     ---- 🔁 毎月のテンプレ ----
     毎月きまって出ていく／入ってくるお金を登録しておくと、
     その月にアプリを開いたとき「入れますか？」と聞いてくれます。
     ・「毎月／偶数月だけ／奇数月だけ」が選べます（水道は2ヶ月ごと など）
     ・入れたあとは、ふつうの明細と同じようにタップして金額を直せます
     ・二重に入らないよう、entries の tpl_key に「どのテンプレの何月ぶんか」を書いています
     ============================================================ */
  var TPL_FREQ = [['month', '毎月', '毎月'], ['even', '偶数月だけ（2・4・6…）', '偶数月'], ['odd', '奇数月だけ（1・3・5…）', '奇数月']];
  var tplDismissed = '';    // 「あとで」を押した月（アプリを開き直すとまた出ます）
  var tplEditId = null;
  var mailWarnDismissed = 0;   // 「とじる」を押したエラーの番号

  /* ---- メール取り込みの実行記録（job_runs）を読みやすくする ---- */
  function runWhen(r) {
    if (!r || !r.ran_at) return '';
    var t = new Date(r.ran_at);
    var how = { timer: '自動チェック', button: '🔄ボタン', manual: '手動' }[r.kind] || r.kind;
    return (t.getMonth() + 1) + '/' + t.getDate() + ' '
      + ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + '（' + how + '）';
  }
  function lastRunText() {
    var r = (state.runs || [])[0];
    if (!r) return '📭 まだ取り込みの記録がありません';
    if (!r.ok) return '⚠️ ' + runWhen(r) + ' エラー：' + r.msg;
    var body = r.n ? r.n + '件 取り込みました' : '新しいメールはありませんでした';
    if (r.voided) body += '／返品で' + r.voided + '件 取り消し';
    // 1時間ごとに動くはずなので、しばらく記録が増えていなければ知らせる
    var hours = (Date.now() - new Date(r.ran_at).getTime()) / 3600000;
    var stale = hours > 3 ? '<br>⚠️ 3時間以上、自動チェックの記録がありません' : '';
    return '✅ ' + runWhen(r) + ' ' + body + stale;
  }

  function tplKinds() {
    return KINDS.map(function (k) { return { key: k.key, label: k.label }; })
      .concat([{ key: 'income', label: '💰収入' }]);
  }
  function realYM() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  }
  function tplKey(t, ym) { return 'tpl:' + t.id + ':' + ym; }
  function freqLabel(f, short) {
    for (var i = 0; i < TPL_FREQ.length; i++) if (TPL_FREQ[i][0] === (f || 'month')) return TPL_FREQ[i][short ? 2 : 1];
    return '毎月';
  }
  /** その月のその日付（31日など無い日は、その月の最終日にまるめます） */
  function tplDate(t, ym) {
    var yy = Number(ym.slice(0, 4)), mm = Number(ym.slice(5, 7));
    var last = new Date(yy, mm, 0).getDate();
    var d = Math.min(Math.max(Number(t.day) || 1, 1), last);
    return ym + '-' + ('0' + d).slice(-2);
  }
  /** 今月ぶんがまだ入っていないテンプレ（＝これから入れる候補） */
  function pendingTpl(ym) {
    var mon = Number(ym.slice(5, 7));
    var isThisMonth = (ym === realYM());
    var today = new Date().getDate();
    return (state.templates || []).filter(function (t) {
      if (t.enabled === false) return false;
      var f = t.freq || 'month';
      if (f === 'even' && mon % 2 !== 0) return false;
      if (f === 'odd' && mon % 2 === 0) return false;
      if (isThisMonth && (Number(t.day) || 1) > today) return false;   // その日が来るまでは出さない
      return !state.tplKeys[tplKey(t, ym)];
    });
  }
  function renderTplBar() {
    var el = document.getElementById('tplBar');
    if (!el) return;
    var h = '';

    // ① メールの取り込みでエラーが出ていたら知らせる
    //    （🔄ボタンは返事を読めないしくみなので、GASが書き残した記録を見ています）
    var r = (state.runs || [])[0];
    if (state.uid && r && !r.ok && mailWarnDismissed !== r.id) {
      h += '<div class="tplBox warn">'
        + '<div class="tplMsg">⚠️ <b>メールの取り込みでエラーが出ています</b><br>'
        + esc(r.msg || '（内容なし）') + '<br><span style="opacity:.75">' + esc(runWhen(r)) + '</span></div>'
        + '<div class="tplBtns"><button class="ghost" onclick="dismissMailWarn()">とじる</button></div>'
        + '</div>';
    }

    // ② 今月ぶんが入っていない毎月テンプレ
    var ym = realYM();
    var list = state.uid ? pendingTpl(ym) : [];
    if (list.length && tplDismissed !== ym) {
      var sum = list.reduce(function (s, t) { return s + (Number(t.amount) || 0); }, 0);
      h += '<div class="tplBox">'
        + '<div class="tplMsg">🔁 <b>' + Number(ym.slice(5, 7)) + '月の毎月テンプレ</b>が' + list.length + '件（' + yen(sum) + '）まだ入っていません</div>'
        + '<div class="tplBtns">'
        + '<button id="tplGo" onclick="applyTpl()">入れる</button>'
        + '<button class="ghost" onclick="dismissTplBar()">あとで</button>'
        + '</div></div>';
    }

    el.innerHTML = h;
    el.style.display = h ? 'block' : 'none';
  }
  function dismissTplBar() {
    tplDismissed = realYM();
    renderTplBar();
  }
  function dismissMailWarn() {
    var r = (state.runs || [])[0];
    mailWarnDismissed = r ? r.id : 0;
    renderTplBar();
  }
  async function applyTpl() {
    var ym = realYM();
    var list = pendingTpl(ym);
    if (!list.length) { renderTplBar(); return; }
    var btn = document.getElementById('tplGo');
    if (btn) { btn.disabled = true; btn.textContent = '入れています…'; }
    var rows = list.map(function (t) {
      var isInc = (t.kind === 'income');
      return {
        user_id: state.uid,
        date: tplDate(t, ym),
        amount: Math.round(Number(t.amount) || 0),
        shop: t.shop || '（無題）',
        category: isInc ? '収入' : (t.category || '未分類'),
        pay: isInc ? '' : (t.pay || ''),
        kind: t.kind || 'fixed',
        memo: '毎月テンプレ',
        tpl_key: tplKey(t, ym)
      };
    });
    var res = await sb.from('entries').insert(rows);
    if (btn) { btn.disabled = false; btn.textContent = '入れる'; }
    if (res.error) { alert('登録に失敗：' + res.error.message); return; }
    toast(rows.length + '件 入れました🌸');
    await refresh();
    if (yearOpen()) renderYear();
  }

        h += '<div class="catrow' + (t.enabled === false ? ' coff' : '') + '" onclick="openTplEdit(\'' + jstr(t.id) + '\')">'
          + '<span class="cemoji">' + (isInc ? '💰' : '🔁') + '</span>'
          + '<span class="cname">' + esc(t.shop || '（無題）')

          + (t.enabled === false ? '・おやすみ中' : '') + '</div></span>'

          + '<span class="chev">❯</span></div>';
      });

    document.getElementById('tplOverlay').className = 'overlay show';

    document.getElementById('tplOverlay').className = 'overlay';
    document.getElementById('tplSheet').style.display = 'none';
  }

  /* ---- テンプレの追加・編集 ---- */
  function openTplEdit(id) {
    tplEditId = id;
    var t = id ? state.templates.filter(function (x) { return x.id === id; })[0] : null;
    if (id && !t) return;
    t = t || { kind: 'fixed', category: '', shop: '', amount: 0, pay: '', day: 1, freq: 'month', enabled: true };
    var kindOpts = tplKinds().map(function (k) {
      return '<option value="' + k.key + '"' + (k.key === (t.kind || 'fixed') ? ' selected' : '') + '>' + esc(k.label) + '</option>';
    }).join('');
    var freqOpts = TPL_FREQ.map(function (f) {
      return '<option value="' + f[0] + '"' + (f[0] === (t.freq || 'month') ? ' selected' : '') + '>' + esc(f[1]) + '</option>';
    }).join('');
    var dayOpts = '';
    for (var d = 1; d <= 28; d++) dayOpts += '<option value="' + d + '"' + (d === (Number(t.day) || 1) ? ' selected' : '') + '>' + d + '日</option>';
    dayOpts += '<option value="31"' + (Number(t.day) === 31 ? ' selected' : '') + '>月末</option>';
    var pays = ['', '現金', 'カード', '口座振替', '電子マネー', 'その他'];
    if (t.pay && pays.indexOf(t.pay) === -1) pays.splice(1, 0, t.pay);
    var payOpts = pays.map(function (p) {
      return '<option value="' + esc(p) + '"' + (p === (t.pay || '') ? ' selected' : '') + '>' + (p ? esc(p) : '（なし）') + '</option>';
    }).join('');

    var isInc = (t.kind === 'income');
    var h = '<h3>' + (id ? '🔁 テンプレを編集' : '🔁 新しいテンプレ') + '</h3>'
      + '<div class="field"><label>どこに入れる？</label><select id="t_kind" onchange="onTplKindChange()">' + kindOpts + '</select></div>'
      + '<div class="field" id="t_catWrap" style="display:' + (isInc ? 'none' : 'block') + '"><label>費目</label>'
      + '<select id="t_cat">' + catOptionsFor(isInc ? 'fixed' : (t.kind || 'fixed'), t.category) + '</select></div>'
      + '<div class="field"><label>内容（' + (isInc ? '例：チエ子生活費' : '例：電気代') + '）</label>'
      + '<input type="text" id="t_shop" value="' + esc(t.shop || '') + '" placeholder="チエ子生活費 など"></div>'
      + '<div class="row2">'
      + '<div class="field"><label>金額（円）</label><input type="number" id="t_amount" inputmode="numeric" value="' + esc(t.amount || 0) + '"></div>'
      + '<div class="field"><label>毎月何日</label><select id="t_day">' + dayOpts + '</select></div>'
      + '</div>'
      + '<div class="field"><label>くりかえし</label><select id="t_freq">' + freqOpts + '</select></div>'
      + '<div class="field" id="t_payWrap" style="display:' + (isInc ? 'none' : 'block') + '"><label>支払・カード</label><select id="t_pay">' + payOpts + '</select></div>'
      + '<div class="setrow"><span class="setname">このテンプレを使う</span>'
      + '<input type="checkbox" id="t_on" style="width:22px;height:22px"' + (t.enabled === false ? '' : ' checked') + '></div>'
      + '<button class="primaryBtn" id="tplSaveBtn" onclick="saveTpl()">保存する</button>';
    if (id) h += '<button class="linkBtn" onclick="delTpl()">✕ このテンプレを削除</button>';
    h += '<button class="linkBtn" onclick="closeTplEdit()">とじる</button>';
    document.getElementById('tplEditSheet').innerHTML = h;
    document.getElementById('tplEditOverlay').className = 'overlay show';
    document.getElementById('tplEditSheet').style.display = 'block';
  }
  function onTplKindChange() {
    var k = document.getElementById('t_kind').value;
    var isInc = (k === 'income');
    document.getElementById('t_catWrap').style.display = isInc ? 'none' : 'block';
    document.getElementById('t_payWrap').style.display = isInc ? 'none' : 'block';
    if (!isInc) document.getElementById('t_cat').innerHTML = catOptionsFor(k, null);
  }
  function closeTplEdit() {
    document.getElementById('tplEditOverlay').className = 'overlay';
    document.getElementById('tplEditSheet').style.display = 'none';
  }
  async function saveTpl() {
    var kindV = document.getElementById('t_kind').value;
    var isInc = (kindV === 'income');
    var shop = document.getElementById('t_shop').value.trim();
    var amount = Number(document.getElementById('t_amount').value);
    if (!shop) { alert('内容を入れてください'); return; }
    if (!(amount > 0)) { alert('金額を入れてください'); return; }
    var row = {
      kind: kindV,
      category: isInc ? '収入' : document.getElementById('t_cat').value,
      shop: shop,
      amount: Math.round(amount),
      pay: isInc ? '' : document.getElementById('t_pay').value,
      day: Number(document.getElementById('t_day').value) || 1,
      freq: document.getElementById('t_freq').value,
      enabled: document.getElementById('t_on').checked
    };
    var btn = document.getElementById('tplSaveBtn');
    btn.disabled = true; btn.textContent = '保存中…';
    var res = tplEditId
      ? await sb.from('templates').update(row).eq('id', tplEditId)
      : await sb.from('templates').insert(Object.assign({ user_id: state.uid }, row));
    btn.disabled = false; btn.textContent = '保存する';
    if (res.error) {
      var m = String(res.error.message || '');
      if (/templates/.test(m) || /does not exist|schema cache|relation/.test(m)) {
        alert('テンプレの保存先テーブル（templates）がまだ作られていないようです。準備の手順を確認してください🙏');
      } else { alert('保存に失敗：' + m); }
      return;
    }
    closeTplEdit();
    await refresh();
    openTplManager();
  }
  async function delTpl() {
    if (!confirm('このテンプレを削除しますか？\n（すでに家計簿に入れた記録は残ります）')) return;
    var res = await sb.from('templates').delete().eq('id', tplEditId);
    if (res.error) { alert('削除に失敗：' + res.error.message); return; }
    closeTplEdit();
    await refresh();
    openTplManager();
  }
