  }
  function closeImport() {
    document.getElementById('impOverlay').className = 'overlay';
    document.getElementById('impSheet').style.display = 'none';
  }
  function isRealDate(s) {
    var p = s.split('-'), yy = +p[0], mm = +p[1], dd = +p[2];
    var d = new Date(yy, mm - 1, dd);
    return d.getFullYear() === yy && d.getMonth() === mm - 1 && d.getDate() === dd;
  }
  function parseImport(text) {
    var lines = text.split(/\r?\n/).map(function (l) { return l.replace(/\s+$/, ''); }).filter(function (l) { return l.trim(); });
    var rows = [], errors = [];
    lines.forEach(function (line, i) {
      var p = line.split('\t');
      if (p.length < 5) { errors.push((i + 1) + '行目：列が足りません'); return; }
      var date = p[0].trim(), amount = Number(p[1].trim());
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !isRealDate(date)) { errors.push((i + 1) + '行目：日付が正しくありません（例：2026-06-01）'); return; }
      if (!(amount > 0)) { errors.push((i + 1) + '行目：金額が正しくありません'); return; }
      rows.push({ date: date, amount: Math.round(amount), shop: p[2].trim() || '（無題）', category: p[3].trim(), pay: p[4].trim() || 'その他' });
    });
    return { rows: rows, errors: errors };
  }
  function updateImpInfo() {
    var r = parseImport(document.getElementById('impText').value);
    var msg = '取り込める：' + r.rows.length + '件';
    if (r.errors.length) msg += ' ／ ⚠️スキップ：' + r.errors.length + '件（' + esc(r.errors.slice(0, 2).join('、')) + (r.errors.length > 2 ? ' …' : '') + '）';
    document.getElementById('impInfo').innerHTML = msg;
  }
  async function runImport() {
    var parsed = parseImport(document.getElementById('impText').value);
    if (!parsed.rows.length) { alert('取り込めるデータがありません'); return; }
    var unknown = parsed.rows.filter(function (r) { return !catDef(r.category); });
    var note = unknown.length ? '\n（' + unknown.length + '件は未登録カテゴリですが、そのまま取り込みます）' : '';
    if (!confirm(parsed.rows.length + '件を取り込みます。よろしいですか？' + note)) return;
    var btn = document.getElementById('impBtn');
    btn.disabled = true; btn.textContent = '取り込み中…';
    var payload = parsed.rows.map(function (r) {
      return { user_id: state.uid, date: r.date, amount: r.amount, shop: r.shop, category: r.category, pay: r.pay, kind: kind };
    });
    var res = await sb.from('entries').insert(payload);
    btn.disabled = false; btn.textContent = '取り込む';
    if (res.error) { alert('取り込みに失敗：' + res.error.message); return; }
    closeImport();
    alert(parsed.rows.length + '件を取り込みました🌸');
    await refresh();
  }

  /* ============================================================
     ---- 年間まとめ（収入と支出をあわせて見る画面）----
     収入は entries に kind='income' で入れています。
     敵１〜敵４のタブは kind でふるい分けているので、収入がタブに出ることはありません。
     ============================================================ */
  var yearY = null;      // まとめ画面で見ている年
  var incEditId = null;  // 収入シートで編集中の記録（新規追加のときは null）

  function todayStr() {
    var t = new Date();
    return t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
  }
  function openYear() {
    closeSettings();
    yearY = y;
    renderYear();
    document.getElementById('year').classList.add('show');
    document.getElementById('yBody').scrollTop = 0;
  }
  function closeYear() { document.getElementById('year').classList.remove('show'); }
  function moveYear(d) { yearY += d; renderYear(); }
  function yearOpen() { return document.getElementById('year').classList.contains('show'); }

  function renderYear() {
    var ys = String(yearY);
    var totalIn = 0, totalOut = 0, byKind = {}, incomes = [];
    var monthly = [];
    for (var i = 0; i < 12; i++) monthly.push({ inc: 0, exp: 0 });

    state.entries.forEach(function (e) {
      if (String(e.date).slice(0, 4) !== ys) return;
      var m = Number(String(e.date).slice(5, 7)) - 1;
      var a = Number(e.amount);
      if (kindOf(e) === 'income') {
        totalIn += a; incomes.push(e);
        if (m >= 0 && m < 12) monthly[m].inc += a;
      } else {
        totalOut += a;
        byKind[kindOf(e)] = (byKind[kindOf(e)] || 0) + a;
        if (m >= 0 && m < 12) monthly[m].exp += a;
      }
    });
    var bal = totalIn - totalOut;

    document.getElementById('yTtl').textContent = ys + '年';

    var h = '<div class="card"><div class="label">' + ys + '年の収支</div>';
    h += '<div class="big ' + (bal >= 0 ? 'plus' : 'minus') + '">'
      + (bal < 0 ? '−' + yen(-bal) : '＋' + yen(bal)) + '</div>';
    h += '<div class="sumrow"><span>💰 収入</span><b>' + yen(totalIn) + '</b></div>';
    h += '<div class="sumrow"><span>🛒 支出</span><b>' + yen(totalOut) + '</b></div>';
    if (totalIn > 0) {
      var rate = Math.round((bal / totalIn) * 100);
      h += '<div class="perday">' + (bal >= 0
        ? '🌷 収入の ' + rate + '% を残せています'
        : '😢 収入より ' + yen(-bal) + ' 多く使っています') + '</div>';
    }
    h += '</div>';

    // 支出の内訳（敵１〜敵４）
    h += '<div class="card"><h2>支出の内訳</h2>';
    KINDS.forEach(function (k) {
      var v = byKind[k.key] || 0;
      var r = totalOut > 0 ? v / totalOut : 0;
      h += '<div class="cat" style="cursor:default">'
        + '<div class="name">' + k.label + '</div>'
        + '<div class="cbar"><div style="width:' + (r * 100).toFixed(1) + '%;background:' + k.color + '"></div></div>'
        + '<div class="num">' + yen(v) + '</div></div>';
    });
    h += '</div>';

    // 月ごとの収支
    h += '<div class="card"><h2>月ごとの収支</h2>' + balanceChartSvg(monthly) + '</div>';

    // 収入の明細
    h += '<h2 style="margin-left:6px">収入の明細（' + incomes.length + '件）</h2>';
    if (!incomes.length) {
      h += '<div class="dEmpty">まだ収入が入っていません。下のボタンから追加してね</div>';
    } else {
      incomes.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      // 月ごとの小計（支出の明細と同じ見せかた）
      var mTotal = {};
      incomes.forEach(function (it) {
        var mk = String(it.date).slice(0, 7);
        mTotal[mk] = (mTotal[mk] || 0) + Number(it.amount);
      });
      var lastM = '';
      incomes.forEach(function (it) {
        var mk = String(it.date).slice(0, 7);
        if (mk !== lastM) { lastM = mk; h += '<div class="day">' + Number(mk.slice(5, 7)) + '月（' + yen(mTotal[mk]) + '）</div>'; }
        var memo = it.memo ? '<div class="meta">' + esc(it.memo) + '</div>' : '';
        h += '<div class="item" style="cursor:pointer" onclick="openIncome(\'' + jstr(it.id) + '\')">'
          + '<div class="info"><div class="shop">' + esc(it.shop) + '</div>' + memo + '</div>'
          + '<div class="amt plus">＋' + yen(it.amount) + '</div>'
          + '<span class="editcue">✏️</span></div>';
      });
    }
    h += '<button class="primaryBtn" style="margin-top:14px" onclick="openIncome(null)">💰 収入を追加</button>';
    h += '<div style="height:24px"></div>';

    document.getElementById('yBody').innerHTML = h;
  }

  // 月ごとの収支グラフ（真ん中の線より上＝黒字、下＝赤字）
  function balanceChartSvg(monthly) {
    var vals = monthly.map(function (m) { return m.inc - m.exp; });
    var maxV = Math.max.apply(null, vals.map(Math.abs).concat([1]));
    var W = 340, H = 170, padX = 6, padT = 8, padB = 20;
    var plotH = H - padT - padB, mid = padT + plotH / 2, half = plotH / 2;
    var slot = (W - padX * 2) / 12, bw = slot * 0.55;
    var s = '<svg class="chartSvg" viewBox="0 0 ' + W + ' ' + H + '">';
    s += '<line x1="' + padX + '" y1="' + mid + '" x2="' + (W - padX) + '" y2="' + mid + '" style="stroke:var(--line)" stroke-width="1"/>';
    vals.forEach(function (v, i) {
      var hh = Math.abs(v) / maxV * half;
      var x = padX + slot * i + (slot - bw) / 2;
      var yb = v >= 0 ? mid - hh : mid;
      if (v !== 0) {
        s += '<rect x="' + x.toFixed(1) + '" y="' + yb.toFixed(1) + '" width="' + bw.toFixed(1)
          + '" height="' + hh.toFixed(1) + '" rx="2" fill="' + (v >= 0 ? '#7fc8a9' : '#ef8080') + '"/>';
      }
      s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9" style="fill:var(--muted2)">' + (i + 1) + '</text>';
    });
    return s + '</svg>';
  }

  /* ---- 収入の入力シート ---- */
  // 選択肢に無い内容（昔に自由入力したものなど）は「その他」あつかいにする
  function incomeIsOther(shop) { return !!shop && INCOME_NAMES.indexOf(shop) === -1; }
  function incomeNameOptions(shop) {
    var sel = incomeIsOther(shop) ? '__other' : (shop || INCOME_NAMES[0]);
    var h = INCOME_NAMES.map(function (n) {
      return '<option value="' + esc(n) + '"' + (n === sel ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('');
    return h + '<option value="__other"' + (sel === '__other' ? ' selected' : '') + '>その他（自由に入力）</option>';
  }
  function onIncomeNameChange() {
    var other = document.getElementById('i_name').value === '__other';
    document.getElementById('i_otherWrap').style.display = other ? 'block' : 'none';
    if (other) document.getElementById('i_shop').focus();
  }
  function openIncome(id) {
    incEditId = id || null;
    var it = incEditId ? state.entries.filter(function (e) { return e.id === incEditId; })[0] : null;
    var d = it ? String(it.date).slice(0, 10)
      : (String(yearY) === String(new Date().getFullYear()) ? todayStr() : yearY + '-01-01');
    var h = '<h3>' + (it ? '✏️ 収入を編集' : '💰 収入を追加') + '</h3>'
      + '<div class="row2">'
      + '<div class="field"><label>金額（円）</label><input type="number" id="i_amount" inputmode="numeric" value="' + (it ? esc(it.amount) : '') + '" placeholder="250000"></div>'
      + '<div class="field"><label>日付</label><input type="date" id="i_date" value="' + esc(d) + '"></div>'
      + '</div>'
      + '<div class="field"><label>内容</label><select id="i_name" onchange="onIncomeNameChange()">' + incomeNameOptions(it ? it.shop : '') + '</select></div>'
      + '<div class="field" id="i_otherWrap" style="display:' + (incomeIsOther(it ? it.shop : '') ? 'block' : 'none') + '">'
      + '<label>その他の内容</label><input type="text" id="i_shop" value="' + (incomeIsOther(it ? it.shop : '') ? esc(it.shop) : '') + '" placeholder="例：メルカリ売上"></div>'
      + '<div class="field"><label>メモ（任意）</label><input type="text" id="i_memo" value="' + (it ? esc(it.memo || '') : '') + '"></div>'
      + '<button class="primaryBtn" id="incSaveBtn" onclick="saveIncome()">保存する</button>';
    if (it) h += '<button class="linkBtn" onclick="delIncome()">✕ この収入を削除</button>';
    document.getElementById('incSheet').innerHTML = h;
    document.getElementById('incOverlay').className = 'overlay show';
    document.getElementById('incSheet').style.display = 'block';
  }
  function closeIncome() {
    document.getElementById('incOverlay').className = 'overlay';
    document.getElementById('incSheet').style.display = 'none';
  }
  async function saveIncome() {
    var amount = Number(document.getElementById('i_amount').value);
    if (!(amount > 0)) { alert('金額を入れてください'); return; }
    var nameSel = document.getElementById('i_name').value;
    var name = (nameSel === '__other') ? document.getElementById('i_shop').value.trim() : nameSel;
    if (!name) { alert('内容を入れてください'); return; }
    var btn = document.getElementById('incSaveBtn');
    btn.disabled = true; btn.textContent = '保存中…';
    var row = {
      date: document.getElementById('i_date').value,
      amount: Math.round(amount),
      shop: name,
      memo: document.getElementById('i_memo').value || '',
      category: '収入',
      pay: '',
      kind: 'income'
    };
    var res = incEditId
      ? await sb.from('entries').update(row).eq('id', incEditId)
      : await sb.from('entries').insert(Object.assign({ user_id: state.uid }, row));
    btn.disabled = false; btn.textContent = '保存する';
    if (res.error) { alert('保存に失敗：' + res.error.message); return; }
    closeIncome();
    await refresh();
    if (yearOpen()) renderYear();
  }
  async function delIncome() {
    if (!confirm('この収入を削除しますか？')) return;
    var res = await sb.from('entries').update({ deleted: true }).eq('id', incEditId);
    if (res.error) { alert('削除に失敗：' + res.error.message); return; }
    closeIncome();
    await refresh();
    if (yearOpen()) renderYear();
  }

  /* ============================================================
     ---- 🔄 今すぐメールを取り込む ----
     GASのウェブアプリは「返事」を読めない決まり（CORS）があるので、
     ①合図だけ送る → ②Supabaseを何回か見に行って、増えていたら知らせる
     という進め方にしています。
     ============================================================ */
  var mailBusy = false;
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function toast(msg, ms) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.className = ''; }, ms || 3200);
  }
  /** いま記録されている「最後の実行」の時刻を取る（無ければ空） */
  async function latestRunAt() {
    var r = await sb.from('job_runs').select('ran_at').order('ran_at', { ascending: false }).limit(1);
    return (!r.error && r.data && r.data[0]) ? r.data[0].ran_at : '';
  }
  /** since より新しい実行記録があれば返す（まだ無ければ null） */
  async function newerRun(since) {
    var r = await sb.from('job_runs').select('*').order('ran_at', { ascending: false }).limit(1);
    if (r.error || !r.data || !r.data[0]) return null;
    var row = r.data[0];
    return (!since || row.ran_at > since) ? row : null;
  }

  async function fetchMailNow() {
    if (!GAS_FETCH_URL || mailBusy) return;
    var btn = document.getElementById('mailBtn');
    mailBusy = true;
    btn.className = 'spinning';
    toast('更新中', 30000);
    try {
      // ログイン証明（アクセストークン）を本文に入れて送る。URLには入れない
      var s = await sb.auth.getSession();
      var token = s.data.session && s.data.session.access_token;
      if (!token) { toast('ログインし直してください🙏'); return; }

      // 送る前の「最後の記録」の時刻をおぼえておく。
      // これより新しい記録が書かれたら、それが今回の実行結果です。
      var since = await latestRunAt();
      try {
        await fetch(GAS_FETCH_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: token
        });
      } catch (e) { /* 返事は読めない決まりなので、ここは気にしない */ }

      // 取り込みには数秒かかるので、3秒おきに最大10回ようすを見る
      var run = null;
      for (var i = 0; i < 10; i++) {
        await sleep(3000);
        run = await newerRun(since);
        if (run) break;
      }
      try { await fetchAll(); } catch (e) { /* 読めなくても下の表示は出す */ }
      load();
      if (yearOpen()) renderYear();
      reopenDetailIfOpen();

      if (!run) {
        toast('⚠️ 取り込み係から返事がありません。⚙️設定で状態を見てください', 7000);
      } else if (!run.ok) {
        toast('⚠️ エラー：' + run.msg, 9000);
      } else if (run.n > 0) {
        toast('🌸 ' + run.n + '件 取り込みました');
      } else {
        toast('📭 新しいメールはありませんでした');
      }
    } finally {
      mailBusy = false;
      btn.className = '';
    }
  }

  /* ---- ログイン関係 ---- */
  async function initAuth() {
    var res = await sb.auth.getSession();
    if (res.data.session) onSignedIn(res.data.session);
    else document.body.classList.remove('signed-in');
  }
  async function onSignedIn(session) {
    state.uid = session.user.id;
    document.body.classList.add('signed-in');
    // 接続先が設定してあるときだけ 🔄 ボタンを出す
    document.body.classList.toggle('mail-ready', !!GAS_FETCH_URL);
    await refresh();
  }
  async function doLogin() {
    var email = document.getElementById('l_email').value.trim();
    var pass = document.getElementById('l_pass').value;
    var msg = document.getElementById('l_msg');
    var btn = document.getElementById('loginBtn');
    msg.textContent = '';
    if (!email || !pass) { msg.textContent = 'メールとパスワードを入れてください'; return; }
    btn.disabled = true; btn.textContent = 'ログイン中…';
    var res = await sb.auth.signInWithPassword({ email: email, password: pass });
    btn.disabled = false; btn.textContent = 'ログイン';
    if (res.error) { msg.textContent = 'ログインできませんでした：' + res.error.message; return; }
    onSignedIn(res.data.session);
  }
  async function doLogout() {
    await sb.auth.signOut();
    state = { uid: null, entries: [], budgets: {}, mbudgets: {}, templates: [], tplKeys: {}, runs: [] };
    closeSettings();
    renderTplBar();
    document.body.classList.remove('signed-in');
    document.body.classList.remove('mail-ready');
  }

  // スマホでアプリを開き直したら、最新のデータに自動で更新する
  // （メール自動取り込みが15分ごとに動いているので、開いたときに反映されているように）
  document.addEventListener('visibilitychange', async function () {
    if (document.visibilityState !== 'visible') return;
    if (!state.uid) return;                                  // ログイン前は何もしない
    if (mailBusy) return;                                    // 🔄 取り込み中はじゃましない
    if (Date.now() - lastFetchAt < 60000) return;            // 1分以内に取ったばかりなら何もしない
    if (document.querySelector('.overlay.show')) return;     // 入力シートを開いている間はじゃましない
    await refresh();
    if (yearOpen()) renderYear();
    reopenDetailIfOpen();
  });

  initAuth();
</script>
</body>
